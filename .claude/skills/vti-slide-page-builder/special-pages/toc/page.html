<!--
  ============================================================================
  SPECIAL PAGE · toc
  ----------------------------------------------------------------------------
  Table of Contents. Reuses the polygonal-mesh photo from the reference
  PPTXs (toc-mesh.jpg = Software.pptx image4) as the top header band.
  Below the mesh sits a royal-blue (#0D58C9) box containing items in a
  2-column layout, with a floating white pill badge straddling the boundary.
  ============================================================================
-->
<div class="slide page-toc">
  <!-- Top mesh photo (from PPTX media) -->
  <header class="toc-mesh">
    <div class="toc-mesh-logo">
      <!-- VTI_LOGO_INJECT position="toc-top-left" variant="full-white" size="84px" -->
    </div>
  </header>

  <!-- Royal blue body box -->
  <main class="toc-box">
    <div class="toc-grid" data-cols="{{TOC_COLS}}">
      {{#each TOC_ITEMS}}
      <div class="toc-group">
        <div class="toc-row toc-row--lvl1">
          <span class="toc-tt">{{this.title}}</span>
          <span class="toc-pg">{{this.page}}</span>
        </div>
        {{#each this.items}}
        <div class="toc-row toc-row--lvl2">
          <span class="toc-tt">{{this.title}}</span>
          <span class="toc-pg">{{this.page}}</span>
        </div>
        {{/each}}
      </div>
      {{/each}}
    </div>
  </main>

  <!-- Floating white pill badge straddling the boundary -->
  <div class="toc-pill">
    <div class="toc-pill-icon">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="white" aria-hidden="true">
        <rect x="4" y="6"  width="16" height="2" rx="1"/>
        <rect x="4" y="11" width="16" height="2" rx="1"/>
        <rect x="4" y="16" width="16" height="2" rx="1"/>
      </svg>
    </div>
    <span class="toc-pill-txt">TABLE OF CONTENTS</span>
  </div>

  <!-- Footer -->
  <div class="fbar">
    <div class="fbar-chev"><span class="fbar-num">{{PAGE_NUM}}</span></div>
    <span class="fbar-sep"></span>
    <span class="fbar-doc">{{DOC_TITLE}}</span>
  </div>
  <div class="fbar-copy">© {{COPYRIGHT_YEAR}} VTI APAC. All rights reserved.</div>
</div>
