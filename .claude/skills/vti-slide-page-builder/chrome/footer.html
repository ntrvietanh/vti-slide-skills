<!--
  ============================================================================
  CHROME · footer
  ----------------------------------------------------------------------------
  Bottom row that appears on every content slide. Two visible regions:

    LEFT  — the brand chevron (deep-blue parallelogram holding the page
            number) + a thin vertical separator + the document title.
            Derived from sw_slide_05 across all 3 reference decks.

    RIGHT — copyright line (© <year> VTI APAC. All rights reserved.). This
            is an addition to the original PPTX pattern — added at the
            customer's request so every slide carries a small footer
            attribution. Kept tiny (10 px) and right-aligned so it doesn't
            visually compete with the chevron.
  ============================================================================
-->
<div class="fbar">
  <div class="fbar-chev">
    <span class="fbar-num">{{PAGE_NUM}}</span>
  </div>
  <span class="fbar-sep"></span>
  <span class="fbar-doc">{{DOC_TITLE}}</span>
</div>
<div class="fbar-copy">© {{COPYRIGHT_YEAR}} VTI APAC. All rights reserved.</div>
