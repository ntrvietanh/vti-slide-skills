<div class="vti-trend-stat vti-trend-stat--{{TREND}}">
  <div class="vti-trend-stat__value">{{VALUE}}</div>
  <div class="vti-trend-stat__delta-row">
    <span class="vti-trend-stat__arrow" aria-hidden="true">{{ARROW_SVG}}</span>
    <span class="vti-trend-stat__delta">{{DELTA}}</span>
    <span class="vti-trend-stat__period">{{PERIOD}}</span>
  </div>
  <div class="vti-trend-stat__label">{{LABEL}}</div>
</div>
